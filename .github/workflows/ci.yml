name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # Scala Native compiles and links with clang
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Native runtime and multithreading tests
        run: sbt -batch library/test

      - name: Capture checking tests
        run: sbt -batch tests/test

      - name: Run native example
        run: sbt -batch example/run
